# n8n.paisareality.com -> n8n on 127.0.0.1:5678
# Installed to /etc/nginx/sites-available/n8n.paisareality.com by deploy/vps/setup-n8n.sh.
# Login is n8n's own owner account. Webhooks stay public because the Telegram bot
# needs them, except the backup webhook, which only the server itself may call.

limit_req_zone $binary_remote_addr zone=n8n_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name n8n.paisareality.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://n8n.paisareality.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n8n.paisareality.com;
    include /etc/nginx/snippets/paisareality-tls.conf;

    client_max_body_size 50m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Called from localhost by /usr/local/bin/paisareality-backup, never from outside.
    location ^~ /webhook/paisa-backup {
        return 404;
    }

    # Slow down password guessing on the login endpoint.
    location = /rest/login {
        limit_req zone=n8n_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/n8n-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/n8n-proxy.conf;
    }
}
