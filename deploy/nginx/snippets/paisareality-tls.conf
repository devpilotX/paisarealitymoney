# /etc/nginx/snippets/paisareality-tls.conf
# Symlinks to the Let's Encrypt files, made by the certbot deploy hook in setup-app.sh.
# Before the first certificate they point at a temporary self-signed pair.
ssl_certificate     /etc/ssl/paisareality/fullchain.pem;
ssl_certificate_key /etc/ssl/paisareality/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:paisa_tls:10m;
ssl_session_timeout 1d;
