# /etc/nginx/snippets/paisareality-proxy.conf
proxy_pass http://paisareality_app;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
# $remote_addr is the visitor after realip (see cloudflare-realip.conf). Both headers
# are overwritten here, so nothing a client sends in them reaches the app.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 90s;
