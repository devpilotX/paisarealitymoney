# Vulnerability scanners ask for files this site has never had (.env, .git, WordPress, PHP).
# Answer them at nginx so they never reach the app. They are still logged, and they still
# count as 404s in Cloudflare; a Cloudflare WAF rule is what keeps them off the origin.
location ~* (^|/)(\.env|\.git|\.svn|\.aws|\.ht[a-z]*|\.DS_Store|wp-admin|wp-login|wp-content|wp-includes|wp-json|xmlrpc\.php|phpmyadmin|cgi-bin)(/|$|\.|\?) {
    return 404;
}
location ~* \.(php|asp|aspx|jsp|cgi|env|bak|sql|ini|yml|yaml|log)$ {
    return 404;
}
