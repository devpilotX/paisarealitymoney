# paisareality.com and admin.paisareality.com
# Cloudflare -> nginx -> Next.js on 127.0.0.1:3000
#
# The Next.js middleware routes the admin area by Host:
#   - admin.paisareality.com serves the /admin dashboard
#   - paisareality.com/admin returns 404
#
# TLS: Let's Encrypt certificate for the three names, issued with the webroot
# below so renewal works whatever the Cloudflare SSL mode is.
#
# Client IP: the real visitor address comes from CF-Connecting-IP, trusted only
# for connections from Cloudflare's published ranges (conf.d/cloudflare-realip.conf).
# $remote_addr is therefore the visitor, and the app reads it from X-Real-IP.
# A direct request to the origin cannot forge it.
#
# Apply on the server:
#   sudo cp deploy/nginx/cloudflare-realip.conf /etc/nginx/conf.d/
#   sudo cp deploy/nginx/paisareality.com.conf /etc/nginx/sites-available/paisareality.com
#   sudo ln -sf /etc/nginx/sites-available/paisareality.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream paisareality_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Port 80. With Cloudflare "Flexible" SSL, visitors on HTTPS arrive here with
# X-Forwarded-Proto: https, so they are served, not redirected (a redirect would
# loop). Anything that really is plain HTTP is sent to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name paisareality.com www.paisareality.com admin.paisareality.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        if ($host = www.paisareality.com) {
            return 301 https://paisareality.com$request_uri;
        }
        include /etc/nginx/snippets/paisareality-proxy.conf;
    }
}

# Canonical host: www redirects to the bare domain.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.paisareality.com;
    include /etc/nginx/snippets/paisareality-tls.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://paisareality.com$request_uri;
    }
}

# Main site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name paisareality.com;
    include /etc/nginx/snippets/paisareality-tls.conf;

    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Hashed build assets never change, so let browsers and Cloudflare keep them.
    location /_next/static/ {
        include /etc/nginx/snippets/paisareality-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/snippets/paisareality-proxy.conf;
    }
}

# Admin dashboard
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.paisareality.com;
    include /etc/nginx/snippets/paisareality-tls.conf;

    client_max_body_size 5m;

    # The admin area must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        include /etc/nginx/snippets/paisareality-proxy.conf;
    }
}
