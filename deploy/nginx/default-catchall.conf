# Requests for any hostname that is not ours (bare IP, stale DNS, scanners):
# closed without an answer instead of falling through to the first site.
# Installed to /etc/nginx/sites-available/000-default-catchall by deploy/vps/apply-nginx.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 444;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    # No certificate is offered, so a TLS client that names no site of ours is refused.
    ssl_reject_handshake on;
}
